<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TURNIO · Combinados</title>
  <style>
    body{font-family:"Segoe UI",sans-serif;padding:28px;max-width:560px;margin:auto;line-height:1.45;color:#1a1a1a;background:#f7fafc}
    h1{font-size:20px;margin:0 0 12px}
    a.btn,button.btn{display:inline-block;margin:14px 8px 14px 0;padding:12px 18px;background:#0b57d0;color:#fff;text-decoration:none;border-radius:8px;font-weight:700;border:0;cursor:pointer;font-size:15px}
    code{font-size:11px;word-break:break-all;display:block;background:#fff;padding:10px;border-radius:8px;border:1px solid #e2e8f0}
    .ok{color:#0f766e;font-weight:700}
  </style>
</head>
<body>
  <h1>Descarga Trenes Combinados</h1>
  <p id="estado">Lanzando descarga .xls…</p>
  <p><button type="button" class="btn" id="go">Descargar .xls de nuevo</button></p>
  <p>Si no baja, pega este enlace en la barra:</p>
  <code id="u"></code>
  <script>
    (function () {
      function fechaHoy() {
        var n = new Date();
        var dd = String(n.getDate()).padStart(2, '0');
        var mm = String(n.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm + '/' + n.getFullYear();
      }
      function urlCombinadosHoy() {
        var fecha = encodeURIComponent(fechaHoy());
        return 'http://copernico.sir.renfe.es/copernico/SrvRenfeSeguimiento'
          + '?todo=combinados&excel=E&codusuario=&hoy=' + fecha
          + '&perfil=3&inicio=false&servicio1=&estacion=&orden=4'
          + '&fechaInicio=' + fecha + '&fechaFin=' + fecha;
      }
      var url = urlCombinadosHoy();
      document.getElementById('u').textContent = url;

      function pedir() {
        document.getElementById('estado').textContent = 'Revisa Descargas (TrenesCombinados.xls). Esta ventana se queda abierta.';
        document.getElementById('estado').className = 'ok';
        var old = document.getElementById('dl');
        if (old) old.parentNode.removeChild(old);
        /* iframe: no cierra la pestaña (location.replace sí lo hacía) */
        var f = document.createElement('iframe');
        f.id = 'dl';
        f.title = 'xls';
        f.setAttribute('referrerpolicy', 'no-referrer');
        f.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
        f.src = url;
        document.body.appendChild(f);

        /* Enlace con nombre forzado .xls (cross-origin: el navegador puede usarlo o no) */
        var a = document.createElement('a');
        a.href = url;
        a.setAttribute('download', 'TrenesCombinados.xls');
        a.rel = 'noreferrer';
        a.setAttribute('referrerpolicy', 'no-referrer');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      document.getElementById('go').addEventListener('click', pedir);
      pedir();
    })();
  </script>
</body>
</html>
