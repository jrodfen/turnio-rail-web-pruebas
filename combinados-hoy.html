<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TURNIO · Combinados</title>
  <style>
    body {
      margin: 0; font-family: "Segoe UI", sans-serif; color: #142033;
      background: linear-gradient(160deg, #e8f1ff 0%, #f7fafc 50%, #eef6f1 100%);
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(520px, 100%); background: #fff; border: 1px solid #d7e0ec;
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 10px 30px rgba(20, 32, 51, .08);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 14px; line-height: 1.45; color: #405066; font-size: 14px; }
    .btn {
      display: inline-block; margin: 4px 8px 4px 0; padding: 12px 18px; border-radius: 10px;
      background: #0b57d0; color: #fff; text-decoration: none; font-weight: 700; border: 0;
      cursor: pointer; font-size: 15px;
    }
    .btn.secondary { background: #eef3f8; color: #142033; }
    code {
      display: block; margin: 12px 0 0; padding: 12px; border-radius: 10px; background: #f3f6fa;
      font-size: 11px; word-break: break-all; border: 1px solid #e2e8f0;
    }
    .ok { color: #0f766e; font-weight: 700; }
    .warn { color: #9a3412; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Trenes Combinados</h1>
    <p id="estado">Pidiendo el Excel a Copérnico…</p>
    <p>
      <button type="button" class="btn" id="btn-xls">Descargar Excel otra vez</button>
      <button type="button" class="btn secondary" id="btn-copiar">Copiar enlace</button>
    </p>
    <p class="warn">Esta página no se descarga: el Excel sale de Copérnico (revisa la carpeta Descargas).</p>
    <code id="url"></code>
  </main>
  <script>
    (function () {
      function fechaHoy() {
        var n = new Date();
        var dd = String(n.getDate()).padStart(2, '0');
        var mm = String(n.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm + '/' + n.getFullYear();
      }
      function urlCombinadosHoy() {
        var fecha = encodeURIComponent(fechaHoy());
        return 'http://copernico.sir.renfe.es/copernico/SrvRenfeSeguimiento'
          + '?todo=combinados&excel=E&codusuario=&hoy=' + fecha
          + '&perfil=3&inicio=false&servicio1=&estacion=&orden=4'
          + '&fechaInicio=' + fecha + '&fechaFin=' + fecha;
      }

      var url = urlCombinadosHoy();
      var estado = document.getElementById('estado');
      document.getElementById('url').textContent = url;

      function setEstado(t, ok) {
        estado.textContent = t;
        estado.className = ok ? 'ok' : '';
      }

      function pedirExcel() {
        /* Navegación de nivel superior ≈ pegar en la barra (sesión Copérnico).
           No usamos HTML guardado como .xls (Excel lo marca dañado). */
        setEstado('Abriendo descarga de Copérnico…', true);
        var a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.setAttribute('referrerpolicy', 'no-referrer');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setEstado('Si no aparece en Descargas, usa «Copiar enlace» y pégalo en la barra.', true);
      }

      document.getElementById('btn-xls').addEventListener('click', pedirExcel);
      document.getElementById('btn-copiar').addEventListener('click', function () {
        function ok() { setEstado('Enlace copiado. Ctrl+L → Ctrl+V → Enter.', true); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(ok).catch(function () {
            try {
              var ta = document.createElement('textarea');
              ta.value = url;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              ok();
            } catch (e) { setEstado('Copia el texto de abajo.'); }
          });
        } else {
          ok();
        }
      });

      pedirExcel();
    })();
  </script>
</body>
</html>
